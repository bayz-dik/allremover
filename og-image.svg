<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2FBF3"/>
      <stop offset="1" stop-color="#DBEFE1"/>
    </linearGradient>
    <linearGradient id="clay" x1="80" y1="60" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FCB99"/><stop offset="0.5" stop-color="#2E9366"/><stop offset="1" stop-color="#1B6A49"/>
    </linearGradient>
    <linearGradient id="blob" x1="150" y1="120" x2="300" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAFBEF"/><stop offset="1" stop-color="#B7E5BA"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.26" r="0.85">
      <stop stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="checker" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#D3ECDA"/><rect width="22" height="22" fill="#BADFC6"/><rect x="22" y="22" width="22" height="22" fill="#BADFC6"/>
    </pattern>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#12503A" flood-opacity="0.28"/>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="320" height="320" rx="94"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- soft background blobs -->
  <circle cx="1080" cy="80" r="180" fill="#C7ECCB" opacity="0.5"/>
  <circle cx="120" cy="600" r="150" fill="#DDEFE0" opacity="0.5"/>

  <!-- logo tile, left side -->
  <g transform="translate(150 155)">
    <g filter="url(#drop)"><rect width="320" height="320" rx="94" fill="url(#clay)"/></g>
    <g clip-path="url(#round)">
      <rect x="0" y="200" width="320" height="120" fill="url(#checker)" opacity="0.85"/>
      <path d="M0 240 q44 -28 88 0 t88 0 t88 0 t68 -5 V200 H0 Z" fill="url(#clay)"/>
    </g>
    <rect width="320" height="320" rx="94" fill="url(#sheen)"/>
    <g filter="url(#drop)" transform="rotate(-6 160 150)">
      <path d="M92 196c0-58 34-98 68-98s68 40 68 98c0 25-34 35-68 35s-68-10-68-35Z" fill="url(#blob)"/>
      <circle cx="160" cy="112" r="52" fill="url(#blob)"/>
      <circle cx="142" cy="107" r="10" fill="#123B2B"/><circle cx="178" cy="107" r="10" fill="#123B2B"/>
      <circle cx="145" cy="104" r="3.4" fill="#fff"/><circle cx="181" cy="104" r="3.4" fill="#fff"/>
      <path d="M140 134q20 17 40 0" stroke="#123B2B" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="122" cy="126" r="8" fill="#E76F51" opacity="0.5"/><circle cx="198" cy="126" r="8" fill="#E76F51" opacity="0.5"/>
    </g>
    <g filter="url(#drop)"><circle cx="292" cy="60" r="34" fill="#E76F51"/></g>
    <g transform="rotate(45 292 60)"><path d="M292 42v36M274 60h36" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/></g>
  </g>

  <!-- text, right side -->
  <g transform="translate(540 0)" font-family="'SF Pro Rounded','Segoe UI',system-ui,sans-serif">
    <text x="0" y="250" font-size="86" font-weight="800" letter-spacing="-3" fill="#12352A">All<tspan fill="#1F724F">Remover</tspan></text>
    <text x="0" y="320" font-size="38" font-weight="700" fill="#12352A">Buang background, langsung jadi.</text>
    <text x="0" y="372" font-size="28" font-weight="500" fill="#3F6B57">Gratis, jalan di HP kamu.</text>
    <text x="0" y="410" font-size="28" font-weight="500" fill="#3F6B57">Gak upload, gak daftar, gak ada server.</text>
    <g transform="translate(0 448)">
      <rect width="168" height="52" rx="26" fill="#B7E5BA"/>
      <text x="84" y="34" font-size="24" font-weight="700" fill="#12352A" text-anchor="middle">100% GRATIS</text>
      <rect x="184" width="176" height="52" rx="26" fill="#DBEFE1"/>
      <text x="272" y="34" font-size="24" font-weight="700" fill="#1F724F" text-anchor="middle">PRIVASI AMAN</text>
    </g>
  </g>
</svg>
