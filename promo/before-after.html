<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AllRemover — Before/After promo maker</title>
<style>
  :root {
    --primary: #1F724F; --primary-bright: #2E9366;
    --mint: #B7E5BA; --mint-soft: #DBEFE1; --cream: #F2FBF3;
    --ink: #12352A; --muted: #3F6B57; --accent: #E76F51;
    --clay-light: #FFFFFF; --clay-dark: #B7D8C2;
    --r-md: 26px; --r-lg: 40px; --r-pill: 999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px 14px 56px; background: var(--cream); color: var(--ink);
    font: 400 1rem/1.55 -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 6px;
  }
  .sub { color: var(--muted); margin: 0 0 26px; }
  .card {
    background: var(--cream); border-radius: var(--r-lg); padding: 22px; margin-bottom: 22px;
    box-shadow: 14px 14px 26px var(--clay-dark), -14px -14px 26px var(--clay-light);
  }
  label.field { display: block; margin-bottom: 16px; }
  label.field > span {
    display: block; font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    font-weight: 700; font-size: 0.9rem; margin-bottom: 7px;
  }
  input[type=text], select, input[type=file] {
    width: 100%; padding: 13px 15px; border: none; border-radius: var(--r-md);
    background: var(--mint-soft); color: var(--ink); font: inherit;
    box-shadow: inset 4px 4px 9px var(--clay-dark), inset -4px -4px 9px var(--clay-light);
  }
  input[type=color] {
    width: 56px; height: 42px; padding: 0; border: none; border-radius: var(--r-md);
    background: var(--mint-soft); cursor: pointer;
  }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .row > label.field { flex: 1 1 180px; margin-bottom: 16px; }
  button {
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    font-weight: 700; font-size: 1rem; border: none; cursor: pointer;
    padding: 15px 26px; border-radius: var(--r-pill); color: #fff;
    background: var(--primary); transition: transform .12s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 8px 8px 18px var(--clay-dark), -8px -8px 18px var(--clay-light);
  }
  button:active { transform: scale(.96); }
  button.ghost { background: var(--mint); color: var(--ink); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  canvas {
    width: 100%; height: auto; display: block; border-radius: var(--r-md);
    box-shadow: 10px 10px 22px var(--clay-dark);
  }
  .hint { color: var(--muted); font-size: .88rem; margin: 14px 0 0; }
  .hint code { background: var(--mint-soft); padding: 2px 6px; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Before / After maker</h1>
  <p class="sub">Gabungin foto asli + hasil cutout jadi satu gambar promo siap posting.</p>

  <div class="card">
    <div class="row">
      <label class="field"><span>1. Foto asli (before)</span>
        <input type="file" id="before" accept="image/*" />
      </label>
      <label class="field"><span>2. Hasil cutout (after, PNG transparan)</span>
        <input type="file" id="after" accept="image/*" />
      </label>
    </div>

    <label class="field"><span>Headline (kosongin kalau nggak mau ada teks)</span>
      <input type="text" id="headline" value="Background ilang dalam 3 detik" maxlength="90" />
    </label>

    <div class="row">
      <label class="field"><span>Ukuran</span>
        <select id="preset">
          <option value="square">Instagram 1:1 — 1080×1080</option>
          <option value="portrait" selected>Instagram 4:5 — 1080×1350</option>
          <option value="story">Story / Reels 9:16 — 1080×1920</option>
          <option value="wide">X / Facebook 16:9 — 1200×675</option>
        </select>
      </label>
      <label class="field"><span>Background panel "after"</span>
        <select id="bgmode">
          <option value="checker" selected>Kotak-kotak (transparan)</option>
          <option value="solid">Warna solid</option>
        </select>
      </label>
      <label class="field" style="flex:0 0 auto"><span>Warna</span>
        <input type="color" id="bgcolor" value="#FFFFFF" />
      </label>
    </div>

    <div class="actions">
      <button id="download" disabled>Download PNG</button>
      <button id="swap" class="ghost">Tukar before/after</button>
    </div>
    <p class="hint">Tip: bikin foto "after"-nya pakai AllRemover sendiri, terus download PNG-nya
      dan masukin ke kolom nomor 2. Caption promonya ambil dari <code>python3 promo/generate.py</code>.</p>
  </div>

  <div class="card" style="padding:14px">
    <canvas id="cv" width="1080" height="1350"></canvas>
  </div>
</div>

<script>
const URL_TEXT = "temanbaik.web.id";
const C = {
  cream: "#F2FBF3", ink: "#12352A", primary: "#1F724F", mint: "#B7E5BA",
  mintSoft: "#DBEFE1", clayDark: "#B7D8C2", accent: "#E76F51", white: "#FFFFFF",
};
const PRESETS = {
  square:   { w: 1080, h: 1080 },
  portrait: { w: 1080, h: 1350 },
  story:    { w: 1080, h: 1920 },
  wide:     { w: 1200, h: 675  },
};
const FONT_ROUND = '-apple-system, "SF Pro Rounded", system-ui, sans-serif';

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let imgBefore = null, imgAfter = null;

/* --- pure helpers (dicek di runSelfCheck) --- */

// Kotak sumber untuk "cover": isi penuh panel tanpa gepeng, kelebihannya dipotong.
function coverRect(iw, ih, w, h) {
  const scale = Math.max(w / iw, h / ih);
  const dw = iw * scale, dh = ih * scale;
  return { sx: 0, sy: 0, dw, dh, ox: (w - dw) / 2, oy: (h - dh) / 2 };
}

// Bungkus teks jadi beberapa baris yang muat di `maxW`. Kata kepanjangan dibiarkan
// (lebih baik meleber sedikit daripada dipotong di tengah kata).
function wrapText(ctx, text, maxW) {
  const words = String(text).trim().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const lines = [];
  let line = words[0];
  for (let i = 1; i < words.length; i++) {
    const test = line + " " + words[i];
    if (ctx.measureText(test).width <= maxW) line = test;
    else { lines.push(line); line = words[i]; }
  }
  lines.push(line);
  return lines;
}

/* --- drawing --- */

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawChecker(c, x, y, w, h, cell) {
  c.fillStyle = C.white;
  c.fillRect(x, y, w, h);
  c.fillStyle = C.mintSoft;
  for (let row = 0; row * cell < h; row++) {
    for (let col = 0; col * cell < w; col++) {
      if ((row + col) % 2 === 0) continue;
      const cx = x + col * cell, cy = y + row * cell;
      c.fillRect(cx, cy, Math.min(cell, x + w - cx), Math.min(cell, y + h - cy));
    }
  }
}

function drawPanel(c, img, x, y, w, h, radius, opts) {
  c.save();
  roundRect(c, x, y, w, h, radius);
  c.clip();

  if (opts.checker) drawChecker(c, x, y, w, h, Math.round(w / 14));
  else { c.fillStyle = opts.bg; c.fillRect(x, y, w, h); }

  if (img) {
    const r = coverRect(img.naturalWidth, img.naturalHeight, w, h);
    c.drawImage(img, x + r.ox, y + r.oy, r.dw, r.dh);
  } else {
    c.fillStyle = C.clayDark;
    c.font = `700 ${Math.round(w * 0.07)}px ${FONT_ROUND}`;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(opts.placeholder, x + w / 2, y + h / 2);
  }
  c.restore();

  // label pill
  const padX = Math.round(w * 0.055), fs = Math.round(w * 0.055);
  c.font = `700 ${fs}px ${FONT_ROUND}`;
  c.textAlign = "left"; c.textBaseline = "middle";
  const tw = c.measureText(opts.label).width;
  const pw = tw + padX * 2, ph = fs * 1.9;
  const px = x + Math.round(w * 0.045), py = y + Math.round(w * 0.045);
  c.fillStyle = opts.labelBg;
  roundRect(c, px, py, pw, ph, ph / 2);
  c.fill();
  c.fillStyle = opts.labelInk;
  c.fillText(opts.label, px + padX, py + ph / 2 + 1);
}

function render() {
  const preset = PRESETS[document.getElementById("preset").value];
  const headline = document.getElementById("headline").value;
  const solid = document.getElementById("bgmode").value === "solid";
  const bgColor = document.getElementById("bgcolor").value;

  const W = preset.w, H = preset.h;
  cv.width = W; cv.height = H;

  ctx.fillStyle = C.cream;
  ctx.fillRect(0, 0, W, H);

  const pad = Math.round(W * 0.055);
  const gap = Math.round(pad * 0.7);
  let top = pad;

  // headline
  if (headline.trim()) {
    const fs = Math.round(W * 0.062);
    ctx.font = `800 ${fs}px ${FONT_ROUND}`;
    ctx.fillStyle = C.ink;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    const lines = wrapText(ctx, headline, W - pad * 2);
    const lh = Math.round(fs * 1.18);
    lines.forEach((ln, i) => ctx.fillText(ln, pad, top + i * lh));
    top += lines.length * lh + Math.round(pad * 0.7);
  }

  // footer (url)
  const footFs = Math.round(W * 0.05);
  const footH = Math.round(footFs * 2.2);
  const panelsH = H - top - footH - pad;
  const contentW = W - pad * 2;
  const radius = Math.round(W * 0.045);

  const beforeOpts = {
    label: "BEFORE", labelBg: C.mint, labelInk: C.ink,
    checker: false, bg: C.mintSoft, placeholder: "foto asli",
  };
  const afterOpts = {
    label: "AFTER", labelBg: C.primary, labelInk: C.white,
    checker: !solid, bg: bgColor, placeholder: "hasil cutout",
  };

  // Portrait-ish → tumpuk vertikal, biar tiap foto tetap lega.
  const stack = H / W >= 1.15;
  if (stack) {
    const ph = Math.floor((panelsH - gap) / 2);
    drawPanel(ctx, imgBefore, pad, top, contentW, ph, radius, beforeOpts);
    drawPanel(ctx, imgAfter, pad, top + ph + gap, contentW, ph, radius, afterOpts);
  } else {
    const pw = Math.floor((contentW - gap) / 2);
    drawPanel(ctx, imgBefore, pad, top, pw, panelsH, radius, beforeOpts);
    drawPanel(ctx, imgAfter, pad + pw + gap, top, pw, panelsH, radius, afterOpts);
  }

  // url watermark
  ctx.font = `700 ${footFs}px ${FONT_ROUND}`;
  ctx.fillStyle = C.primary;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(URL_TEXT, W / 2, H - pad - footH / 2 + Math.round(footH * 0.15));

  document.getElementById("download").disabled = !(imgBefore || imgAfter);
}

/* --- input wiring --- */

function loadInto(input, assign) {
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if (!file) { assign(null); render(); return; }
    if (!file.type.startsWith("image/")) { alert("Pilih file gambar."); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { assign(img); render(); URL.revokeObjectURL(url); };
    img.onerror = () => { alert("Gambar gagal dibuka."); URL.revokeObjectURL(url); };
    img.src = url;
  });
}
loadInto(document.getElementById("before"), (i) => { imgBefore = i; });
loadInto(document.getElementById("after"), (i) => { imgAfter = i; });

["headline", "preset", "bgmode", "bgcolor"].forEach((id) =>
  document.getElementById(id).addEventListener("input", render));

document.getElementById("swap").addEventListener("click", () => {
  const t = imgBefore; imgBefore = imgAfter; imgAfter = t; render();
});

document.getElementById("download").addEventListener("click", () => {
  cv.toBlob((blob) => {
    if (!blob) { alert("Export gagal."); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `allremover-promo-${document.getElementById("preset").value}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, "image/png");
});

// ponytail: satu check buat matematika layout (cover + wrap). Buka dengan
// before-after.html#test lalu lihat console.
function runSelfCheck() {
  const r = coverRect(200, 100, 400, 400);
  console.assert(Math.abs(r.dw / r.dh - 2) < 1e-9, "cover: aspect ratio berubah");
  console.assert(r.dw >= 400 && r.dh >= 400, "cover: panel nggak ketutup penuh");
  ctx.font = `800 40px ${FONT_ROUND}`;
  const lines = wrapText(ctx, "satu dua tiga empat lima enam tujuh delapan", 200);
  console.assert(lines.length > 1, "wrap: teks panjang harusnya kepecah");
  console.assert(wrapText(ctx, "   ", 200).length === 0, "wrap: teks kosong harus []");
  console.log("selfcheck OK");
}
if (location.hash === "#test") runSelfCheck();

render();
</script>
</body>
</html>
